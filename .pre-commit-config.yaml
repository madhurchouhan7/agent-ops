
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false

      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false

      - id: mypy
        name: Strict type checking
        entry: uv run --locked mypy
        language: system
        pass_filenames: false

      - id: pytest
        name: Test suite
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
