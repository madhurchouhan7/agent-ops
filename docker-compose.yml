version: "3.8"

services:
  agentops:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentops:latest
    container_name: agentops-control-plane
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg://agentops:agentops_secret@postgres:5432/agentops
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: agentops-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=agentops
      - POSTGRES_PASSWORD=agentops_secret
      - POSTGRES_DB=agentops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: agentops-pgdata
